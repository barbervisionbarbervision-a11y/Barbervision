<!doctype html>
<html lang="pt-BR">
  <body style="font-family: Arial, sans-serif; color: #181512; line-height: 1.5">
    <h1 style="font-size: 22px">Recuperação de acesso</h1>
    <p>Use o botão abaixo para criar uma nova senha do Barber Vision.</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
        style="display: inline-block; border-radius: 8px; background: #c6963b; color: #000; padding: 12px 18px; text-decoration: none; font-weight: 700"
      >Criar nova senha</a>
    </p>
    <p>Se você não solicitou a recuperação, ignore a mensagem.</p>
  </body>
</html>
