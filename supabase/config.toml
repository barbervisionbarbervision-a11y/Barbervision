project_id = "barbervision"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://127.0.0.1:3010/**"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Mantém o provider de e-mail disponível para login/convites. O cadastro público
# continua bloqueado por auth.enable_signup = false.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.template.invite]
subject = "Seu convite para o Barber Vision"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Recupere seu acesso ao Barber Vision"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "15MiB"

[storage.vector]
enabled = false

[analytics]
enabled = false
