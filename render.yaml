services:
  - type: web
    name: barbervision
    runtime: node
    plan: free
    region: ohio
    # NODE_ENV=production já existe durante o build no Render. Inclua
    # Tailwind/PostCSS e demais ferramentas de compilação de devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: BARBERVISION_APP_URL
        sync: false
      - key: BARBERVISION_CRON_SECRET
        sync: false
      - key: BARBERVISION_ENABLE_UNSAFE_INTERNAL_DEMO
        value: "false"
